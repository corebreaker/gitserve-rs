[package]
name = "gitserve"
version = "1.0.0"
edition = "2024"
description = "A little HTTP server exposing local bare Git repositories over the smart HTTP protocol"
license = "GPL-3.0-or-later"
repository = "https://github.com/corebreaker/gitserve-rs"
readme = "README.md"
keywords = ["git", "http", "server", "repository"]
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]
exclude = [".circleci/", ".github/", "CLAUDE.md"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
flate2 = "1.1"
git-storage-trait = "0.1"
gix-hash = "0.28"
gix-validate = "0.13"
gunnar-wire = "2.0"
log = "0.4"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
storage-git-gix = "0.3"
tempfile = "3.27"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
zip = { version = "9.7", default-features = false, features = ["deflate-flate2", "time"] }
